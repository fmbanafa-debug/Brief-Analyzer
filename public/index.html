<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banafa's Daily Brief</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #121212; color: #ececec; font-family: 'Inter', sans-serif; }
    .message-box { position: fixed; top: 1rem; right: 1rem; z-index: 50; display:none }
    .message-box.visible { display:block }
  </style>
</head>
<body>
  <div id="message-box" class="message-box p-3 rounded font-bold"></div>
  <div class="container mx-auto max-w-xl p-8">
    <h1 class="text-2xl mb-8">News Analyzer (Stable Demo)</h1>

    <div id="drop-area" class="p-8 rounded bg-gray-800 text-center border-2 border-dashed border-purple-500 cursor-pointer mb-5">
      <div>Drag &amp; Drop a PNG/JPEG screenshot or PDF here,<br>or click/copy to browse</div>
      <input id="imageUpload" type="file" accept="image/*,application/pdf" class="hidden" />
    </div>
    <button id="analyzeImageBtn" class="w-full mt-2 mb-4 px-4 py-2 bg-blue-600 text-white font-bold rounded hover:bg-blue-700">Analyze</button>
    <div id="loadingIndicator" class="my-4 text-blue-400" style="display:none;">
      <span id="loadingText">Analyzing...</span>
    </div>
    <div>
      <input id="newsTitle" placeholder="Title" class="w-full mb-3 p-2 rounded bg-gray-700" />
      <textarea id="newsSummary" rows="2" placeholder="Summary" class="w-full mb-3 p-2 rounded bg-gray-700"></textarea>
      <textarea id="newsFullDescription" rows="4" placeholder="Full Description" class="w-full mb-3 p-2 rounded bg-gray-700"></textarea>
      <input id="newsTag" placeholder="Tag" class="w-full mb-3 p-2 rounded bg-gray-700" />
    </div>
  </div>

  <script>
    // DOM elements
    const imageUpload = document.getElementById("imageUpload");
    const analyzeImageBtn = document.getElementById("analyzeImageBtn");
    const loadingIndicator = document.getElementById("loadingIndicator");
    const loadingText = document.getElementById("loadingText");
    const newsTitleInput = document.getElementById("newsTitle");
    const newsSummaryInput = document.getElementById("newsSummary");
    const newsFullDescriptionInput = document.getElementById("newsFullDescription");
    const newsTagInput = document.getElementById("newsTag");
    const messageBox = document.getElementById("message-box");
    const dropArea = document.getElementById("drop-area");

    function showMessage(msg, isError = false) {
      messageBox.textContent = msg;
      messageBox.className = "message-box visible p-3 rounded font-bold " + (isError ? "bg-red-500" : "bg-green-600");
      setTimeout(() => messageBox.className = "message-box p-3 rounded font-bold", 3500);
    }

    // Universal robust image preprocessor (contrast and grayscale)
    function preprocessImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new window.Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = img.width; canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
            const data = imageData.data;
            for (let i=0;i<data.length;i+=4) {
              const gray = 0.3*data[i]+0.59*data[i+1]+0.11*data[i+2];
              const v = Math.max(0, Math.min(255, (gray-128)*1.3+128));
              data[i] = data[i+1] = data[i+2] = v;
            }
            ctx.putImageData(imageData,0,0);
            canvas.toBlob(blob => {
              const r2 = new FileReader();
              r2.onload = e2 => resolve(e2.target.result.split(",")[1]);
              r2.readAsDataURL(blob);
            }, 'image/jpeg', 0.95);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handleFile(file) {
      if (!file) return showMessage("Please select a file.", true);

      let fileType = file.type;
      let prompt = "";
      let base64Data = null;

      loadingIndicator.style.display = "";
      loadingText.textContent = fileType.startsWith("image/") ? "Improving image..." : "Loading PDF...";
      analyzeImageBtn.disabled = true;
      try {
        if (fileType.startsWith("image/")) {
          base64Data = await preprocessImage(file);
          prompt =
`You are an expert news analyst. Analyze this news screenshot image. Do OCR/vision. Return a JSON object with: "title", "summary", "fullDescription" (as bullet points with **bold** keywords), and "tag" (best guess if not obvious). If the image is poor, do your best. Respond with only the JSON object.`;
        } else if (fileType === "application/pdf") {
          base64Data = await new Promise(res=>{
            const r = new FileReader();
            r.onload = e => res(e.target.result.split(",")[1]);
            r.readAsDataURL(file);
          });
          prompt =
`You are an expert news analyst. Analyze this PDF news article. Extract: "title", "summary", "fullDescription" (bulleted), "tag". Respond with only the JSON object.`;
        } else {
          showMessage("Unsupported file format.", true);
          return;
        }
      } catch(e) {
        showMessage("File could not be read or preprocessed.", true);
        loadingIndicator.style.display = "none";
        analyzeImageBtn.disabled = false;
        return;
      }
      loadingText.textContent = "Analyzing content...";

      // Build API payload
      const payload = {
        contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: fileType, data: base64Data } }] }],
        generationConfig: { responseMimeType: "application/json" }
      };
      try {
        const resp = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!resp.ok) {
          showMessage("Backend error: " + resp.status, true);
          return;
        }
        const result = await resp.json();
        const dataRaw = result?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!dataRaw) throw new Error("No content found");
        const data = JSON.parse(dataRaw);
        newsTitleInput.value = data.title || "";
        newsSummaryInput.value = data.summary || "";
        newsFullDescriptionInput.value = data.fullDescription || "";
        newsTagInput.value = data.tag || "";
        showMessage("Article analyzed and fields filled!");
      } catch(e) {
        showMessage("Analysis failed: " + (e.message || e), true);
      } finally {
        loadingIndicator.style.display = "none";
        analyzeImageBtn.disabled = false;
      }
    }

    // UI event hooks (robust, no duplicates!)
    analyzeImageBtn.onclick = () => handleFile(imageUpload.files[0]);
    imageUpload.onchange = () => {
      if (imageUpload.files[0]) handleFile(imageUpload.files[0]);
    };
    dropArea.ondragover = e => { e.preventDefault(); dropArea.classList.add("bg-purple-800"); };
    dropArea.ondragleave = () => dropArea.classList.remove("bg-purple-800");
    dropArea.ondrop = e => {
      e.preventDefault(); dropArea.classList.remove("bg-purple-800");
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        imageUpload.files = files;
        handleFile(files[0]);
      }
    };
    dropArea.onclick = () => imageUpload.click();
  </script>
</body>
</html>
