<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banafa's Daily Brief</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; }
        .container { max-width: 1200px; }
        .news-card { min-height: 200px; }
        .message-box { position: fixed; top: 1rem; right: 1rem; z-index: 50; }
        .drop-area { border: 2px dashed #4B5563; background-color: #1F2937; transition: all 0.3s ease; }
        .drop-area.active { border-color: #6366F1; background-color: #111827; }
        .header-bg { background: linear-gradient(135deg, #A855F7, #6D28D9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-gray-950 text-gray-200">

    <div id="message-box" class="message-box p-4 bg-green-500 text-white rounded-lg shadow-xl hidden transition-all duration-300 ease-in-out"></div>

    <div class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-12">
            <div class="flex items-center justify-center mb-4">
                <img src="https://placehold.co/60x60/8B5CF6/FFFFFF?text=Logo" alt="Banafa Logo" class="h-16 w-16 mr-4">
                <h1 class="text-5xl md:text-6xl font-bold header-bg">Banafa's Daily Brief</h1>
            </div>
            <p class="text-lg md:text-xl text-gray-400">Your curated news, on your own terms.</p>
        </header>

        <div class="mb-12 space-y-6 md:space-y-0 md:flex md:items-center md:space-x-4">
            <div class="flex-grow">
                <label for="tagFilter" class="block text-sm font-medium text-gray-400 mb-1">Filter by Tag</label>
                <select id="tagFilter" class="w-full px-4 py-2 bg-gray-800 text-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors"></select>
            </div>
            <div class="relative flex-grow">
                <input type="text" id="searchInput" placeholder="Search by keyword..." class="w-full pl-10 pr-4 py-2 bg-gray-800 text-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
            </div>
            <div class="flex space-x-2 flex-wrap">
                <button id="analyzeImpactBtn" class="bg-purple-600 px-6 py-2 rounded-xl">Analyze Market ✨</button>
                <button id="showAddFormBtn" class="bg-indigo-600 px-6 py-2 rounded-xl">Add New Article</button>
            </div>
        </div>

        <div id="addFormContainer" class="hidden bg-gray-800 p-8 rounded-2xl shadow-xl mb-12">
            <h2 class="text-2xl font-bold mb-4">Analyze & Add News</h2>
            <div id="drop-area" class="drop-area text-center p-8 rounded-lg mb-6 cursor-pointer">
                <p class="text-gray-400">Drag & drop news (PNG/JPG/PDF) or click to browse</p>
                <input type="file" id="imageUpload" accept="image/*, application/pdf" class="hidden">
            </div>
            <button id="analyzeImageBtn" class="w-full py-3 bg-blue-600 font-bold rounded-xl mb-4">Analyze Document</button>
            <div id="loadingIndicator" class="hidden text-center text-blue-400 mb-4">
                <span class="animate-pulse">Analyzing content...</span>
            </div>

            <form id="addNewsForm" class="space-y-4">
                <input type="text" id="newsTitle" placeholder="Title" required class="w-full p-2 bg-gray-700 rounded-lg">
                <textarea id="newsSummary" placeholder="Short Summary" required class="w-full p-2 bg-gray-700 rounded-lg"></textarea>
                <textarea id="newsFullDescription" rows="5" placeholder="Details (points)" required class="w-full p-2 bg-gray-700 rounded-lg"></textarea>
                <select id="newsTag" required class="w-full p-2 bg-gray-700 rounded-lg"></select>
                <input type="url" id="sourceUrl" placeholder="Source URL (Optional)" class="w-full p-2 bg-gray-700 rounded-lg">
                <div class="flex space-x-4">
                    <button type="submit" class="w-full py-3 bg-green-600 font-bold rounded-xl">Save Article</button>
                    <button type="button" id="cancelFormBtn" class="w-full py-3 bg-gray-600 rounded-xl">Cancel</button>
                </div>
            </form>
        </div>

        <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <script>
        (function() {
            // Configuration
            const API_KEY = "YOUR_API_KEY_HERE"; 
            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            
            // DOM
            const dropArea = document.getElementById('drop-area');
            const imageUpload = document.getElementById('imageUpload');
            const analyzeImageBtn = document.getElementById('analyzeImageBtn');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const newsTitleInput = document.getElementById('newsTitle');
            const newsSummaryInput = document.getElementById('newsSummary');
            const newsFullDescriptionInput = document.getElementById('newsFullDescription');
            const newsTagInput = document.getElementById('newsTag');

            // --- Working OCR/Analysis Logic from Demo ---
            async function preprocessImage(file) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = e => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width; canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);
                            const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
                            const data = imageData.data;
                            for (let i=0; i<data.length; i+=4) {
                                const gray = 0.3*data[i] + 0.59*data[i+1] + 0.11*data[i+2];
                                const v = Math.max(0, Math.min(255, (gray-128)*1.3+128));
                                data[i] = data[i+1] = data[i+2] = v;
                            }
                            ctx.putImageData(imageData,0,0);
                            canvas.toBlob(blob => {
                                const r2 = new FileReader();
                                r2.onload = e2 => resolve(e2.target.result.split(",")[1]);
                                r2.readAsDataURL(blob);
                            }, 'image/jpeg', 0.95);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            async function handleFileAnalysis(file) {
                if (!file) return;
                loadingIndicator.classList.remove('hidden');
                analyzeImageBtn.disabled = true;

                try {
                    const base64Data = await preprocessImage(file);
                    const prompt = "Analyze this news screenshot. Return JSON: {title, summary, fullDescription (points), tag}.";
                    
                    const response = await fetch(API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Data } }] }]
                        })
                    });

                    const result = await response.json();
                    const rawText = result.candidates[0].content.parts[0].text.replace(/```json|```/g, "");
                    const data = JSON.parse(rawText);

                    newsTitleInput.value = data.title || "";
                    newsSummaryInput.value = data.summary || "";
                    newsFullDescriptionInput.value = data.fullDescription || "";
                    newsTagInput.value = data.tag || "AI";
                    
                    document.getElementById('message-box').classList.remove('hidden');
                    document.getElementById('message-box').innerText = "Analysis Complete!";
                } catch (err) {
                    console.error("Analysis failed", err);
                } finally {
                    loadingIndicator.classList.add('hidden');
                    analyzeImageBtn.disabled = false;
                }
            }

            // Event Hooks
            analyzeImageBtn.onclick = () => handleFileAnalysis(imageUpload.files[0]);
            dropArea.onclick = () => imageUpload.click();
            imageUpload.onchange = () => { if(imageUpload.files[0]) handleFileAnalysis(imageUpload.files[0]); };
            
            // Re-integrate the rest of your original display/save functions here...
            // (loadNews, renderNews, filter, etc.)
        })();
    </script>
</body>
</html>
